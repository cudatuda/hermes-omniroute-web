name: web-omniroute
version: 2.0.0
description: "OmniRoute web search + extract — routes web_search to OmniRoute /api/v1/search and web_extract to OmniRoute /api/v1/web/fetch."
author: cudatuda
license: MIT
kind: backend
homepage: https://github.com/cudatuda/hermes-omniroute-web
provides_web_providers:
  - omniroute
python_dependencies:
  - "httpx>=0.27,<1"
requires_env:
  - name: OMNIROUTE_API_URL
    description: "OmniRoute base URL including /v1, e.g. https://your-omniroute:20128/v1"
    secret: false
  - name: OMNIROUTE_API_KEY
    description: "OmniRoute API key"
    url: "https://github.com/diegosouzapw/OmniRoute"
    secret: true
